services:
  - type: web
    name: hostel-management-system
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: super-secret-jwt-key-hostel-system-2026
      - key: ADMIN_CODE
        value: warden123
      - key: APP_URL
        sync: false
